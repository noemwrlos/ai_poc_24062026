<!DOCTYPE html>
<html lang="en" x-data="chatApp()" x-init="initApp()" :class="{ 'dark': darkMode }">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    :root {
      --bg-body: #f3f4f6;
      --bg-surface: #ffffff;
      --bg-sidebar: #f8f9fa;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --border-color: #e5e7eb;
      --user-bubble: #2563eb;
      --user-bubble-text: #ffffff;
      --assistant-bubble: #f3f4f6;
      --assistant-bubble-text: #111827;
      --system-bubble: #fef3c7;
      --system-bubble-text: #92400e;
      --input-bg: #ffffff;
      --hover-bg: #f3f4f6;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    html.dark {
      --bg-body: #0f172a;
      --bg-surface: #1e293b;
      --bg-sidebar: #172033;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border-color: #334155;
      --user-bubble: #3b82f6;
      --user-bubble-text: #ffffff;
      --assistant-bubble: #334155;
      --assistant-bubble-text: #f1f5f9;
      --system-bubble: #78350f;
      --system-bubble-text: #fde68a;
      --input-bg: #0f172a;
      --hover-bg: #334155;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .chat-sidebar {
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      width: 280px;
      transition: transform 0.3s ease;
    }

    .chat-main {
      background-color: var(--bg-body);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      box-shadow: var(--shadow);
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      scroll-behavior: smooth;
    }

    .input-area {
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
    }

    .message {
      display: flex;
      margin-bottom: 1.25rem;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      margin-right: 0.75rem;
    }

    .message-content {
      max-width: 80%;
      padding: 0.875rem 1.125rem;
      border-radius: 1.125rem;
      line-height: 1.5;
      word-wrap: break-word;
      box-shadow: var(--shadow);
      white-space: pre-wrap;
    }

    .message-user {
      flex-direction: row-reverse;
    }

    .message-user .message-avatar {
      margin-right: 0;
      margin-left: 0.75rem;
      background-color: var(--user-bubble);
      color: var(--user-bubble-text);
    }

    .message-user .message-content {
      background-color: var(--user-bubble);
      color: var(--user-bubble-text);
      border-bottom-right-radius: 0.25rem;
    }

    .message-assistant .message-avatar {
      background-color: var(--assistant-bubble);
      color: var(--assistant-bubble-text);
      border: 1px solid var(--border-color);
    }

    .message-assistant .message-content {
      background-color: var(--assistant-bubble);
      color: var(--assistant-bubble-text);
      border-bottom-left-radius: 0.25rem;
    }

    .message-system .message-avatar {
      background-color: var(--system-bubble);
      color: var(--system-bubble-text);
    }

    .message-system .message-content {
      background-color: var(--system-bubble);
      color: var(--system-bubble-text);
      border-radius: 1.125rem;
    }

    .message-meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
      text-align: right;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
      display: inline-block;
      animation: typing 1.4s infinite ease-in-out both;
      margin: 0 2px;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .form-control, .form-control:focus {
      background-color: var(--input-bg);
      color: var(--text-primary);
      border-color: var(--border-color);
    }

    .form-control::placeholder {
      color: var(--text-secondary);
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 0.5rem;
    }

    .status-connecting { background-color: #f59e0b; animation: pulse 1.5s infinite; }
    .status-connected { background-color: #10b981; }
    .status-disconnected { background-color: #ef4444; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .sidebar-link {
      color: var(--text-secondary);
      padding: 0.625rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sidebar-link:hover {
      background-color: var(--hover-bg);
      color: var(--text-primary);
    }

    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      padding: 3rem 1rem;
    }

    @media (max-width: 768px) {
      .chat-sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 1040;
        transform: translateX(-100%);
      }
      .chat-sidebar.open {
        transform: translateX(0);
      }
      .message-content {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="d-flex h-100">
    <!-- Sidebar -->
    <aside class="chat-sidebar d-flex flex-column p-3" :class="{ 'open': sidebarOpen }">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <h5 class="m-0 fw-bold"><i class="bi bi-stars me-2"></i>AKMF Chat</h5>
        <button class="btn btn-sm btn-icon d-md-none" @click="sidebarOpen = false">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="mb-3">
        <button class="btn btn-primary w-100 rounded-pill" @click="startConversation()" :disabled="!connected">
          <i class="bi bi-plus-lg me-2"></i>New Chat
        </button>
      </div>

      <div class="mb-3">
        <label class="form-label small text-secondary">System Prompt</label>
        <textarea
          class="form-control form-control-sm"
          rows="5"
          x-model="systemPrompt"
          placeholder="You are a helpful assistant."
        ></textarea>
        <div class="form-text">Used when starting a new conversation.</div>
      </div>

      <div class="mt-auto">
        <div class="sidebar-link mb-2" @click="toggleTheme()">
          <i class="bi" :class="darkMode ? 'bi-sun' : 'bi-moon-stars'" style="width: 24px; display: inline-block;"></i>
          <span x-text="darkMode ? 'Light mode' : 'Dark mode'"></span>
        </div>
        <div class="sidebar-link text-danger" @click="endConversation()">
          <i class="bi bi-power" style="width: 24px; display: inline-block;"></i>
          Disconnect
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="chat-main">
      <header class="chat-header d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <button class="btn btn-sm btn-icon me-2 d-md-none" @click="sidebarOpen = true">
            <i class="bi bi-list"></i>
          </button>
          <div>
            <h5 class="m-0 fw-semibold">Chat</h5>
            <small class="text-secondary d-flex align-items-center">
              <span class="status-dot" :class="statusClass"></span>
              <span x-text="statusText"></span>
              <span x-show="sessionId" x-text="' · ' + sessionId" class="ms-1 font-monospace"></span>
            </small>
          </div>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-icon" @click="toggleTheme()" title="Toggle theme">
            <i class="bi" :class="darkMode ? 'bi-sun' : 'bi-moon-stars'"></i>
          </button>
        </div>
      </header>

      <div class="messages-area" id="messages-area" x-ref="messagesArea">
        <template x-if="messages.length === 0">
          <div class="empty-state">
            <i class="bi bi-chat-square-text display-4 mb-3 d-block"></i>
            <h5>Start a conversation</h5>
            <p class="mb-0">Type a message below or click "New Chat" to begin.</p>
          </div>
        </template>

        <template x-for="msg in messages" :key="msg.id">
          <div class="message" :class="'message-' + msg.role">
            <div class="message-avatar">
              <i class="bi" :class="msg.role === 'user' ? 'bi-person' : msg.role === 'system' ? 'bi-gear' : 'bi-robot'"></i>
            </div>
            <div>
              <div class="message-content" x-html="formatContent(msg.content)"></div>
              <div class="message-meta" x-text="msg.role === 'assistant' ? 'Assistant' : msg.role === 'system' ? 'System' : 'You'"></div>
            </div>
          </div>
        </template>

        <template x-if="streamingContent !== ''">
          <div class="message message-assistant">
            <div class="message-avatar"><i class="bi bi-robot"></i></div>
            <div>
              <div class="message-content" x-text="streamingContent"></div>
              <div class="message-meta">Assistant</div>
            </div>
          </div>
        </template>

        <template x-if="(isTyping || streamFlushPending) && streamingContent === ''">
          <div class="message message-assistant">
            <div class="message-avatar"><i class="bi bi-robot"></i></div>
            <div class="message-content" style="min-width: 60px;">
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
            </div>
          </div>
        </template>
      </div>

      <div class="input-area">
        <form @submit.prevent="sendMessage()" class="d-flex gap-2 align-items-end">
          <textarea
            id="message-input"
            class="form-control rounded-pill px-4"
            rows="1"
            x-model="input"
            placeholder="Type your message..."
            :disabled="!connected || isTyping"
            @keydown.enter.prevent="if (!event.shiftKey) sendMessage()"
            @input="autoResize($event)"
            style="resize: none; overflow-y: hidden; min-height: 46px; max-height: 150px; padding-top: 0.75rem; padding-bottom: 0.75rem;"
          ></textarea>
          <button
            type="submit"
            class="btn btn-primary btn-icon"
            :disabled="!input.trim() || !connected || isTyping"
            title="Send message"
          >
            <i class="bi bi-send-fill"></i>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script>
    function chatApp() {
      return {
        ws: null,
        connected: false,
        connecting: false,
        conversationStarted: false,
        sessionId: null,
        messages: [],
        input: '',
        pendingMessage: '',
        isTyping: false,
        streamingContent: '',
        streamBuffer: [],
        streamFlushPending: false,
        systemPrompt: 'You are a helpful assistant.',
        darkMode: false,
        sidebarOpen: false,
        reconnectAttempts: 0,
        maxReconnectAttempts: 5,
        wsUrl: {{ ws_url | tojson }},
        scrollThrottle: null,
        messageId: 0,

        get statusClass() {
          if (this.connecting) return 'status-connecting';
          return this.connected ? 'status-connected' : 'status-disconnected';
        },

        get statusText() {
          if (this.connecting) return 'Connecting...';
          return this.connected ? 'Connected' : 'Disconnected';
        },

        initApp() {
          const saved = localStorage.getItem('darkMode');
          this.darkMode = saved !== null ? saved === 'true' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          this.connect();
        },

        toggleTheme() {
          this.darkMode = !this.darkMode;
          localStorage.setItem('darkMode', this.darkMode);
        },

        connect() {
          if (this.ws) return;
          this.connecting = true;

          this.ws = new WebSocket(this.wsUrl);

          this.ws.onopen = () => {
            this.connecting = false;
            this.connected = true;
            this.reconnectAttempts = 0;
          };

          this.ws.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              this.handleEvent(data);
            } catch (e) {
              console.error('Failed to parse message:', e);
            }
          };

          this.ws.onclose = () => {
            this.connected = false;
            this.connecting = false;
            this.ws = null;
            this.conversationStarted = false;
            this.isTyping = false;
            this.streamingContent = '';
            this.streamBuffer = [];
            this.streamFlushPending = false;
            this.maybeReconnect();
          };

          this.ws.onerror = (error) => {
            console.error('WebSocket error:', error);
          };
        },

        maybeReconnect() {
          if (this.reconnectAttempts < this.maxReconnectAttempts) {
            this.reconnectAttempts++;
            setTimeout(() => this.connect(), 2000 * this.reconnectAttempts);
          }
        },

        handleEvent(event) {
          switch (event.type) {
            case 'connected':
              this.sessionId = event.session_id;
              break;
            case 'started':
              this.conversationStarted = true;
              this.sessionId = event.session_id;
              if (this.pendingMessage) {
                this.send({ type: 'user_message', content: this.pendingMessage });
                this.pendingMessage = '';
              }
              break;
            case 'assistant_chunk':
              this.isTyping = false;
              this.bufferChunk(event.content);
              break;
            case 'assistant_message':
              this.isTyping = false;
              this.flushStreamBuffer();
              this.finalizeAssistantMessage(event.message.content);
              break;
            case 'history':
              this.streamingContent = '';
              this.messages = (event.messages || []).map((m) => ({ id: ++this.messageId, ...m }));
              this.scrollToBottom();
              break;
            case 'error':
              this.isTyping = false;
              this.showError(event.message);
              break;
          }
        },

        send(message) {
          if (this.ws && this.ws.readyState === WebSocket.OPEN) {
            this.ws.send(JSON.stringify(message));
          }
        },

        startConversation() {
          this.messages = [];
          this.streamingContent = '';
          this.streamBuffer = [];
          this.streamFlushPending = false;
          this.send({ type: 'start', system_prompt: this.systemPrompt.trim() || null });
        },

        sendMessage() {
          const content = this.input.trim();
          if (!content || !this.connected || this.isTyping) return;

          this.input = '';
          this.resetTextarea();
          this.messages.push({ id: ++this.messageId, role: 'user', content });
          this.scrollToBottom();

          if (!this.conversationStarted) {
            this.pendingMessage = content;
            this.startConversation();
            return;
          }

          this.isTyping = true;
          this.send({ type: 'user_message', content });
        },

        bufferChunk(chunk) {
          this.streamBuffer.push(chunk);
          if (!this.streamFlushPending) {
            this.streamFlushPending = true;
            requestAnimationFrame(() => this.flushStreamBuffer());
          }
        },

        flushStreamBuffer() {
          if (this.streamBuffer.length === 0) {
            this.streamFlushPending = false;
            return;
          }
          this.streamingContent += this.streamBuffer.join('');
          this.streamBuffer = [];
          this.streamFlushPending = false;
          this.throttledScrollToBottom();
        },

        finalizeAssistantMessage(content) {
          this.streamingContent = '';
          this.messages.push({ id: ++this.messageId, role: 'assistant', content });
          this.scrollToBottom();
        },

        endConversation() {
          if (this.ws) {
            this.send({ type: 'end' });
            this.ws.close();
          }
        },

        showError(message) {
          this.messages.push({ id: ++this.messageId, role: 'system', content: 'Error: ' + message });
          this.scrollToBottom();
        },

        formatContent(text) {
          return (text || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/\n/g, '<br>');
        },

        isNearBottom() {
          const area = this.$refs.messagesArea;
          if (!area) return true;
          return area.scrollHeight - area.scrollTop - area.clientHeight < 100;
        },

        scrollToBottom() {
          this.$nextTick(() => {
            const area = this.$refs.messagesArea;
            if (area) area.scrollTop = area.scrollHeight;
          });
        },

        throttledScrollToBottom() {
          if (this.scrollThrottle) return;
          this.scrollThrottle = setTimeout(() => {
            this.scrollThrottle = null;
            if (this.isNearBottom()) {
              this.scrollToBottom();
            }
          }, 50);
        },

        autoResize(event) {
          const el = event.target;
          el.style.height = 'auto';
          el.style.height = Math.min(el.scrollHeight, 150) + 'px';
        },

        resetTextarea() {
          this.$nextTick(() => {
            const el = document.getElementById('message-input');
            if (el) {
              el.style.height = 'auto';
              el.style.height = '46px';
            }
          });
        }
      }
    }
  </script>
</body>
</html>
